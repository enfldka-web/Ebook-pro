# Render.com 배포용 Blueprint. Render 대시보드에서 "New +" → "Blueprint"로
# 이 저장소를 연결하면 아래 설정이 자동으로 읽혀 서버가 배포된다.
# ANTHROPIC_API_KEY / OPENAI_API_KEY는 여기 값이 없으므로(sync:false) Render
# 대시보드에서 직접 입력해야 한다 — Git에는 절대 API Key를 커밋하지 않는다.
services:
  - type: web
    name: atlas-image-gateway
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ATLAS_CORS_ALLOWED_ORIGINS
        value: https://enfldka-web.github.io
