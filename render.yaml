# Render.com 배포용 Blueprint. Render 대시보드에서 "New +" → "Blueprint"로
# 이 저장소를 연결하면 아래 설정이 자동으로 읽혀 서버 + DB가 함께 배포된다.
# sync:false로 표시된 값들은 여기 값이 없으므로 Render 대시보드에서 직접
# 입력해야 한다 — Git에는 절대 API Key/시크릿을 커밋하지 않는다.
# 2026-08-13: 썸네일 AI 이미지 생성 기능(OpenAI 연동)이 완전히 제거되어
# OPENAI_API_KEY는 더 이상 아무 곳에서도 쓰이지 않으므로 삭제했다. 대신
# 실제 회원가입/로그인/구독 상태를 저장하는 PostgreSQL 데이터베이스와
# JWT 서명용 비밀 값(JWT_SECRET, generateValue로 Render가 자동 생성)을
# 추가했다 — 토스페이먼츠 결제·무료체험 1회 제한이 여기 저장된 실제 계정을
# 기준으로 동작한다(server/db.js, server/image-gateway.js /api/auth/*).
# 2026-08-14: ADMIN_EMAILS(쉼표로 구분한 이메일 목록) — 여기 적힌 이메일로
# 가입한 계정은 무료체험 1회 제한 없이 항상 이용할 수 있다(운영자 본인
# 계정용). 값을 안 채우면 아무도 관리자 취급되지 않는다(기본값 안전).
# RESEND_API_KEY — 회원가입 이메일 인증번호 발송(Resend, resend.com)에
# 쓰인다. 값이 없으면 인증번호 발송 라우트가 503으로 "설정 안 됨"을
# 알린다(다른 필수 키들과 같은 원칙).
# 2026-08-17: DB를 free → Basic-256mb 유료 플랜으로 업그레이드했다. Render의
# 무료 PostgreSQL은 생성 후 30일이 지나면 자동 삭제되어(가입 계정/구독
# 상태가 전부 유실됨) 실제 결제 사용자가 생기기 시작한 시점에는 무료 플랜을
# 유지할 수 없다 — 대시보드에서 업그레이드한 실제 플랜명을 그대로 반영한다.
databases:
  - name: atlas-db
    plan: basic-256mb
    databaseName: atlas
    user: atlas

services:
  - type: web
    name: atlas-image-gateway
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ATLAS_CORS_ALLOWED_ORIGINS
        value: https://enfldka-web.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
